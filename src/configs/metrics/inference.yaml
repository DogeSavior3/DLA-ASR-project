train: []
inference:
  - _target_: src.metrics.text.TextCERMetric
    name: "CER_(Argmax)"
    prediction_key: argmax_text
  - _target_: src.metrics.text.TextWERMetric
    name: "WER_(Argmax)"
    prediction_key: argmax_text
  - _target_: src.metrics.text.TextCERMetric
    name: "CER_(Beam${inferencer.beam_size})"
    prediction_key: beam_text
  - _target_: src.metrics.text.TextWERMetric
    name: "WER_(Beam${inferencer.beam_size})"
    prediction_key: beam_text
  - _target_: src.metrics.text.TextCERMetric
    name: "CER_(Beam${inferencer.lm_beam_size}+LM)"
    prediction_key: beam_lm_text
  - _target_: src.metrics.text.TextWERMetric
    name: "WER_(Beam${inferencer.lm_beam_size}+LM)"
    prediction_key: beam_lm_text
